# OrbStack:  HOST_PORT=7801 docker compose up --build -d   ->  http://127.0.0.1:7801/
# The server binds 0.0.0.0 INSIDE the container (PRIV_LOG_BIND is the opt-in), but the port is published on loopback only.
# Do not change the 127.0.0.1 below. HOST_PORT must stay 7801.
# Mock is the default here (MODE=mock). Real is owner-run: put PRIV_LOG_GATEWAY_URL and PRIV_LOG_AGENT_KEY (and optionally
# PRIV_LOG_SEARCH_URL, PRIV_LOG_SEARCH_INDEX) in the environment of this command; the key is write-only and is never shown or logged.
# No host mounts, no docker socket, no host network.
name: privilege-logging-lab

services:
  privilege-logging-lab:
    restart: unless-stopped
    build: .
    ports:
      - "127.0.0.1:${HOST_PORT:-7801}:7801"
    environment:
      PORT: "7801"
      PRIV_LOG_BIND: 0.0.0.0
      MODE: ${MODE:-mock}
      LAB_ALLOWED_HOSTS: ${LAB_ALLOWED_HOSTS:-privilege-logging-lab.local.ping-devops.com}
      SHELF_URL: ${SHELF_URL:-}
      PRIV_LOG_GATEWAY_URL: ${PRIV_LOG_GATEWAY_URL:-}
      PRIV_LOG_AGENT_KEY: ${PRIV_LOG_AGENT_KEY:-}
      PRIV_LOG_SEARCH_URL: ${PRIV_LOG_SEARCH_URL:-}
      PRIV_LOG_SEARCH_INDEX: ${PRIV_LOG_SEARCH_INDEX:-}
      PRIV_LOG_FED_SIGNING_SEED: ${PRIV_LOG_FED_SIGNING_SEED:-}
      PRIV_LOG_FED_AUDIENCE: ${PRIV_LOG_FED_AUDIENCE:-}
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7801/api/health').then(r=>r.json()).then(j=>process.exit(j.schema==='demo-health/1'&&j.state==='ready'?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      start_period: 5s
      start_interval: 2s
      timeout: 5s
      retries: 3
